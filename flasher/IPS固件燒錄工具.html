<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rainy75 V2 IPS 固件燒錄工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh; padding: 20px;
    display: flex; justify-content: center; align-items: flex-start;
    color: #333;
  }
  .container { width: 100%; max-width: 760px; background: #fff;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 15px 35px rgba(50,50,93,.12), 0 5px 15px rgba(0,0,0,.07); }
  .header { background: linear-gradient(to right, #4b6cb7, #182848);
    color: #fff; padding: 22px; text-align: center; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 12px; opacity: .8; margin-top: 4px; }
  .header p.fw { font-family: Consolas, monospace; opacity: .95; letter-spacing: .5px; }
  .body { padding: 22px; }
  .row { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .card { flex: 1 1 0; min-width: 0; border: 2px solid #e3e8f0; border-radius: 12px;
    padding: 18px 10px; cursor: pointer; transition: .15s; text-align: center; }
  .card:hover { border-color: #9bb0d8; }
  .card.active { border-color: #4b6cb7; background: #f4f7fd; }
  .card h3 { font-size: 15px; font-weight: 600; margin: 0; }
  .card .meta { font-size: 12px; color: #777; line-height: 1.7; }
  button { border: 0; border-radius: 10px; padding: 11px 18px; font-size: 14px;
    cursor: pointer; transition: .15s; font-family: inherit; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .primary { background: #4b6cb7; color: #fff; }
  .primary:hover:not(:disabled) { background: #3c5896; }
  .ghost { background: #eef2f9; color: #35507f; }
  .danger { background: #c0392b; color: #fff; }
  .status { margin: 14px 0 8px; font-size: 13px; font-weight: 600; }
  .bar { height: 12px; background: #eef2f9; border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg,#4b6cb7,#6f8fd8); }
  .pct { font-size: 12px; color: #666; margin-top: 4px; text-align: right; }
  #log { margin-top: 14px; background: #0f1523; color: #b9c8e4; border-radius: 10px;
    padding: 12px; height: 220px; overflow-y: auto; font-family: Consolas, monospace;
    font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
  .ok { color: #3ddc84; } .err { color: #ff6b6b; } .warn { color: #ffd166; }
  .tip { font-size: 12px; color: #7a8699; margin-top: 10px; line-height: 1.8; }
  /* 2026-11-04: 烧录结果横幅（成功/失败都给明确指示） */
  .banner { display: none; margin: 10px 0; padding: 14px 16px; border-radius: 10px;
    font-size: 16px; font-weight: 700; line-height: 1.5; }
  .banner.ok  { display: block; background: #e6f9ee; color: #1b7f3b; border: 2px solid #3ddc84; }
  .banner.err { display: block; background: #fdeceb; color: #b03a2e; border: 2px solid #ff6b6b; }

    button.pulse {
      animation: pulse 1s ease-in-out infinite;
      border-color: #4da3ff;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(77,163,255,0.7); }
      50%      { box-shadow: 0 0 0 6px rgba(77,163,255,0); }
    }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Rainy75 V2 IPS 固件燒錄工具</h1>
    <p>選擇本機 .bin 固件 · 使用 Chrome / Edge · 僅限 USB 有線</p>
    <p class="fw">仅处理 IPS 屏幕；不含主控或接收器镜像</p>
  </div>
  <div class="body">
    <div class="row">
      <div class="card" id="cardKbd" style="display:none"><h3>键盘主板</h3></div>
      <div class="card" id="cardRcv" style="display:none"><h3>接收器</h3></div>
      <div class="card" id="cardIps" onclick="pick('ips')"><h3>屏幕</h3></div>
    </div>

    <div style="margin-bottom:16px">
      <label for="firmwareFile">選擇 Rainy75 V2 IPS 固件（.bin）</label><br>
      <input id="firmwareFile" type="file" accept=".bin" onchange="loadFirmware(this.files[0])" style="margin:12px 0">
      <div id="fileInfo" style="font-size:12px;line-height:1.8;overflow-wrap:anywhere">尚未選擇固件</div>
      <label style="display:block;margin-top:12px;font-size:13px"><input id="confirmIps" type="checkbox" onchange="updateStartButton()"> 我確認所選檔案適用於 Rainy75 V2 IPS 螢幕</label>
    </div>
    <div class="row">
      <button class="primary" id="btnStart" onclick="start()" disabled>开始烧录</button>
      <button class="danger" id="btnCancel" onclick="cancel()" disabled>取消</button>
    </div>

    <div class="status" id="status">已限定 IPS 屏幕：请先关闭 WOBHub 等驱动页面，再开始烧录</div>
    <div class="banner" id="banner"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="pct" id="pct">0%</div>
    <div id="log"></div>
    <div class="tip">
      請先關閉其他驅動頁面，再用 USB 數據線連接鍵盤。<br>
      原廠恢復：選擇 firmware/stock/ips-original-v2.bin。<br>
      基本格式檢查不能保證未知固件相容。寫入期間不要拔線；本頁不能刷主鍵盤或接收器。
    </div>
  </div>
</div>

<script>
// ======================= 固件（由使用者選擇，不內嵌） =======================
const FIRMWARE = { ips: { name: '屏幕(IPS)', appPid: 0x3075, iapPid: 0x3078, startAddr: 0x4000, version: '未選擇', bootCmd: [0xbe,0xfc,5,0,0xed] } };

const VENDOR_ID = 0x36B0;
const USAGE_PAGE = 0xFF60;
const CMD_PROM = 0x80, CMD_ERASE = 0x81, CMD_VERIFY = 0x82, CMD_END = 0x83;
const REPORT_LEN = 64;      // IAP 接口报告固定 64 字节，短包必须补零，否则设备认为包不完整
const CHUNK = 62;           // 写入分片（64 - 2 字节头）
const CHUNK_VERIFY = 56;    // 校验分片（64 - 8，和官方 IAP 工具一致，不能写到 58）
const RETRY = 10;           // 同一小段连续失败的最大重试次数（和官方工具一致）
const RETRY_DELAY = 20;     // 重试间隔 ms
const ERASE_WAIT = 1200;    // 擦除应答回来后还要等这么久才能写（设备还在后台收尾）

let target = 'ips';       // 'kbd' | 'rcv' | 'ips'
let dev = null;          // HIDDevice
let running = false;
let cancelled = false;
let rxq = [];            // 已到达但还没被取走的应答（先进先出）
let rxWait = null;       // 正在等应答的那个 resolve
let outId = 0;           // 探测到的输出报告 ID
let outLen = 0;          // 探测到的输出报告长度


let selectedImage = null;
let selectionGeneration = 0;
const KNOWN_IMAGES = {
  '1d1aef4fdffd3a0e5855e17cc1c1345c24be461a26146e9f7039468082408e04': 'Game Hub v5 遊戲合集（10 個遊戲，開機選單）',
  '32defab7902e57eb972a577fc6cbf3a7e57bc772d59b99f11038370412b77f41': '原廠 IPS v2'
};
function validateFirmware(data) {
  if (data.length < 256 || data.length > 0xF8000) throw new Error('固件大小不符合 IPS 範圍（256～1015808 bytes，最遠到 0x080FC000 設定頁之前）');
  const view = new DataView(data.buffer, data.byteOffset, data.byteLength);
  const stack = view.getUint32(0, true), reset = view.getUint32(4, true);
  if (stack < 0x20000000 || stack > 0x20060000 || stack % 8 !== 0) throw new Error('不是有效的 IPS ARM 初始堆疊');
  if (!(reset & 1) || (reset & ~1) < 0x08004000 || (reset & ~1) >= 0x08004000 + data.length) throw new Error('IPS 重置向量超出固件範圍');
}
function padFirmware(data) {
  const result = new Uint8Array(Math.ceil(data.length / 512) * 512);
  result.fill(255); result.set(data); return result;
}
function updateStartButton() {
  document.getElementById('btnStart').disabled = running || !selectedImage || !document.getElementById('confirmIps').checked;
}
async function loadFirmware(file) {
  if (running) return;
  const generation = ++selectionGeneration;
  selectedImage = null;
  document.getElementById('confirmIps').checked = false;
  updateStartButton();
  if (!file) { document.getElementById('fileInfo').textContent = '尚未選擇固件'; return; }
  try {
    if (!file.name.toLowerCase().endsWith('.bin')) throw new Error('請選擇 .bin 檔案');
    if (file.size < 256 || file.size > 0xF8000) throw new Error('固件大小超出範圍');
    const data = new Uint8Array(await file.arrayBuffer());
    validateFirmware(data);
    const hash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', data)), x => x.toString(16).padStart(2, '0')).join('');
    if (generation !== selectionGeneration) return;
    const label = KNOWN_IMAGES[hash] || '未知版本（未經本項目驗證）';
    selectedImage = {data, name:file.name, hash, label};
    FIRMWARE.ips.version = label;
    document.getElementById('fileInfo').textContent = file.name + ' · ' + data.length + ' bytes\n' + label + '\nSHA-256: ' + hash;
    document.getElementById('fileInfo').style.whiteSpace = 'pre-wrap';
    setStatus('格式檢查通過，確認固件用途後可開始燒錄');
  } catch (error) {
    if (generation !== selectionGeneration) return;
    document.getElementById('fileInfo').textContent = error.message;
    setStatus(error.message, 'err');
  }
  updateStartButton();
}

// ======================= 界面 =======================
function pick(which) {
  if (which !== 'ips') return;
  if (running) return;
  target = which;
  document.getElementById('cardKbd').classList.toggle('active', which === 'kbd');
  document.getElementById('cardRcv').classList.toggle('active', which === 'rcv');
  document.getElementById('cardIps').classList.toggle('active', which === 'ips');
  const fw = FIRMWARE[which];
  setStatus('已选择：' + fw.name + '（固件 ' + fw.version + '）');
}

function setStatus(text, cls) {
  const el = document.getElementById('status');
  el.textContent = text;
  el.style.color = cls === 'ok' ? '#1b7f3b' : cls === 'err' ? '#c0392b' : '#333';
}

/* 2026-11-04: 烧录结果横幅 */
function showBanner(text, cls) {
  const el = document.getElementById('banner');
  el.textContent = text;
  el.className = 'banner ' + (cls || 'ok');
}
function hideBanner() {
  const el = document.getElementById('banner');
  el.className = 'banner';
  document.title = 'Rainy75V2 固件烧录工具';
}

function setProgress(pct) {
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('pct').textContent = Math.round(pct) + '%';
}

function log(text, cls) {
  const box = document.getElementById('log');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* requestDevice 必须有"用户手势"（一次点击）。烧录流程里 await 过多次以后手势就失效了，
 * 第一次用（IAP 设备还没授权过）直接调会抛 SecurityError。这里用这个标记把控制权交回界面：
 * 提示用户点一次按钮，连接成功后自动继续烧录。 */
function NeedGesture(msg) { this.needGesture = true; this.message = msg; }
let pendingFlash = null;   /* 等待用户点按钮后要继续烧录的固件 */

// ======================= WebHID =======================
async function requestDevice(productId, withUsagePage) {
  if (!navigator.hid) throw new Error('浏览器不支持 WebHID，请用 Chrome/Edge 89+');
  // 应用模式必须带 usagePage 0xFF60（和仓库里能用的消抖工具一致）：
  // 否则会列出 4 个接口，用户可能选到标准键盘接口 -> 写报告被拒
  // 2026-11-05: 支持传数组 —— 这样"强制进 boot"的设备也能在选择框里出现。
  const pids = Array.isArray(productId) ? productId : [productId];
  // 2026-11-12: 应用模式 PID 一律带 0xFF60，避免授权到标准键盘接口（之后会被优先取到而打不开）
  const isApp = p => Object.keys(FIRMWARE).some(k => FIRMWARE[k].appPid === p);
  const filters = pids.map(p => (withUsagePage || isApp(p))
    ? { vendorId: VENDOR_ID, productId: p, usagePage: USAGE_PAGE }
    : { vendorId: VENDOR_ID, productId: p });
  const devices = await navigator.hid.requestDevice({ filters });
  if (!devices.length) throw new Error('没有选择设备');
  // 设备有多个 HID 接口，只有 usagePage 0xFF60 那个能发自定义报告。
  // 优先挑带 0xFF60 的；都带就选第一个。
  let d = devices.find(x => (x.collections || []).some(c => c.usagePage === USAGE_PAGE));
  if (!d) {
    d = devices[0];
    log('警告：选中的接口不是 0xFF60，可能无法下发命令', 'warn');
  }
  if (!d.opened) await d.open();
  d.addEventListener('inputreport', onReport);
  return d;
}

/* 2026-11-05: PID -> 设备 key。IAP 的 PID 唯一；应用模式 0x3075 键盘和屏幕共用，
 * 这种情况返回 null，由调用方决定（默认按键盘处理）。 */
function keyByIapPid(pid) {
  for (const k of Object.keys(FIRMWARE)) {
    if (FIRMWARE[k].iapPid === pid) return k;
  }
  return null;
}

async function findByPid(productId) {
  if (!navigator.hid) return null;
  const list = (await navigator.hid.getDevices()).filter(d => d.vendorId === VENDOR_ID && d.productId === productId);
  /* 2026-11-12: 同一个 PID 在 macOS 上是 4 个独立接口（标准键盘、媒体键、0xFF60…）。
   * 以前取列表第一个，可能拿到系统不允许打开的标准键盘接口 -> "Failed to open the device"。
   * 只有 0xFF60 那个能收发命令，所以优先取它。 */
  return list.find(isControlInterface) || list[0] || null;
}

function isControlInterface(d) {
  return (d.collections || []).some(c => c.usagePage === USAGE_PAGE);
}

/* 打开已授权设备：先试 0xFF60 接口，打不开就换下一个，全都打不开返回 null（由调用方重新弹选择框）。 */
async function openAuthorized(productId) {
  if (!navigator.hid) return null;
  const list = (await navigator.hid.getDevices()).filter(d => d.vendorId === VENDOR_ID && d.productId === productId);
  list.sort((a, b) => Number(isControlInterface(b)) - Number(isControlInterface(a)));
  for (const d of list) {
    try {
      if (!d.opened) await d.open();
      d.addEventListener('inputreport', onReport);
      return d;
    } catch (e) {
      log('  接口打不开（' + (isControlInterface(d) ? '0xFF60' : '非控制接口') + '）：' + (e.message || e), 'warn');
    }
  }
  return null;
}

function onReport(e) {
  const data = new Uint8Array(e.data.buffer, e.data.byteOffset, e.data.byteLength);
  if (rxWait) { const w = rxWait; rxWait = null; w.resolve(data); }
  else if (rxq.length < 8192) rxq.push(data);   // 流水线写入时先排队，不能丢
}

// 取一个应答（先进先出）。超时抛异常。
function nextReport(timeoutMs) {
  if (rxq.length) return Promise.resolve(rxq.shift());
  return new Promise((resolve, reject) => {
    const t = setTimeout(() => {
      if (rxWait) { rxWait = null; reject(new Error('应答超时')); }
    }, timeoutMs || 5000);
    rxWait = { resolve: (d) => { clearTimeout(t); resolve(d); } };
  });
}

// 列出这台设备所有输出报告（报告 ID + 字节数），大的排前面。
// 键盘 0xFF60 是 256 字节，IAP 是 64 字节，屏幕又是另一套，所以不能写死。
function outReports(d) {
  const list = [];
  for (const c of (d && d.collections) || []) {
    for (const r of (c.outputReports || [])) {
      let bits = 0;
      for (const it of (r.items || [])) bits += (it.reportCount || 0) * (it.reportSize || 0);
      const len = Math.ceil(bits / 8);
      if (len > 0) list.push({ id: r.reportId || 0, len: len });
    }
  }
  list.sort((a, b) => b.len - a.len);
  return list;
}

// 发一包。报告 ID 和长度都按设备自己的描述符来，逐个试，通了就记住。
async function sendPkt(bytes) {
  const n = bytes.length;
  const cand = [];
  const add = (id, len) => {
    if (len < n) return;                      // 报告装不下这一包就不试
    if (cand.some(x => x.id === id && x.len === len)) return;
    cand.push({ id: id, len: len });
  };
  if (outLen) add(outId, outLen);             // 上次成功的优先
  for (const r of outReports(dev)) add(r.id, r.len);
  add(0, REPORT_LEN);
  add(0, n);

  let lastErr = null;
  for (const c of cand) {
    const buf = new Uint8Array(c.len);
    buf.set(bytes.subarray(0, Math.min(n, c.len)));
    try {
      await dev.sendReport(c.id, buf);
      outId = c.id;
      outLen = c.len;
      return;
    } catch (e) { lastErr = e; }
  }
  const tried = cand.map(c => 'id' + c.id + '/' + c.len + 'B').join(' ');
  throw new Error('无法向设备发送数据（' +
    (lastErr && lastErr.message ? lastErr.message : '未知原因') +
    '；已试 ' + tried + '）');
}

function hex2(v) { return '0x' + (v & 0xff).toString(16).padStart(2, '0'); }

function hex32(v) { return '0x' + (v >>> 0).toString(16).toUpperCase().padStart(4, '0'); }

// 换设备/换阶段时把残留应答清掉，免得把上一阶段的应答当成擦除应答；
// 顺手按新设备的报告长度重新算 outLen
function resetRx() { rxq = []; rxWait = null; outId = 0; outLen = 0; }

// 判定应答：WCH IAP 成功时返回 00 00
function replyOk(rep) {
  return !!rep && rep.length >= 2 && rep[0] === 0x00 && rep[1] === 0x00;
}

function replyText(rep) {
  if (!rep) return '无应答';
  if (rep.length < 2) return '应答过短（' + rep.length + ' 字节）';
  return hex2(rep[0]) + ' ' + hex2(rep[1]);
}

// 单包命令：发一次收一次应答，失败重试（tries 可单独压小，别让界面像卡死）
async function cmdOk(pkt, timeoutMs, tries) {
  const n = (tries === undefined || tries === null) ? RETRY : tries;
  let last = '无应答';
  for (let attempt = 0; attempt <= n; attempt++) {
    if (cancelled) throw new Error('已取消');
    await sendPkt(pkt);
    try {
      const rep = await nextReport(timeoutMs || 5000);
      if (replyOk(rep)) return;
      last = replyText(rep);
    } catch (e) { last = e.message; }
    await sleep(RETRY_DELAY);
  }
  throw new Error('设备返回 ' + last);
}

// ======================= IAP 流程 =======================
function u32(addr) {
  return [addr & 0xff, (addr >> 8) & 0xff, (addr >> 16) & 0xff, (addr >> 24) & 0xff];
}

function erasePkt(addr) {
  const p = new Uint8Array(6);
  p[0] = CMD_ERASE; p[1] = 0;
  p.set(u32(addr), 2);
  return p;
}

function promPkt(data, off, n) {
  const p = new Uint8Array(2 + n);
  p[0] = CMD_PROM; p[1] = n;
  p.set(data.subarray(off, off + n), 2);
  return p;
}

function verifyPkt(data, off, n, addr) {
  const p = new Uint8Array(6 + n);
  p[0] = CMD_VERIFY; p[1] = n;
  p.set(u32(addr), 2);
  p.set(data.subarray(off, off + n), 6);
  return p;
}

// 一包一发一应答：和官方工具一样 —— 发一包、等它自己的应答、再发下一包。
// 不做窗口、不做流水线：设备吃不下突发，一次多发几包它就不回应答了。
async function pipeline(build, total, unit, timeoutMs, startPct, endPct, verb, baseAddr) {
  let off = 0;
  let lastPct = -1;

  while (off < total) {
    if (cancelled) throw new Error('已取消');
    const n = Math.min(unit, total - off);
    const pkt = build(off, n);

    let ok = false;
    let last = '无应答';
    for (let attempt = 0; attempt <= (verb === '写入' ? 0 : RETRY); attempt++) {
      if (cancelled) throw new Error('已取消');
      try {
        await sendPkt(pkt);
        const rep = await nextReport(timeoutMs);
        if (replyOk(rep)) { ok = true; break; }
        last = replyText(rep);
      } catch (e) { last = e.message; }
      await sleep(RETRY_DELAY);
    }
    if (!ok) throw new Error(verb + '失败（地址 ' + hex32(baseAddr + off) + ' 附近）：' + last);

    off += n;
    const pct = startPct + (endPct - startPct) * off / total;
    if (pct - lastPct >= 0.5) { lastPct = pct; setProgress(pct); }
  }
  setProgress(endPct);
}

async function iapErase(addr) {
  log('  擦除中…');
  // 擦除应答要等近 2 秒；设备要是彻底没反应就别反复重试，直接报错
  await cmdOk(erasePkt(addr), 10000, 2);
  // 应答回来时擦除还在后台收尾，官方工具也是 sleep(1) 再写。
  // 注意：这里不能拿 VERIFY 去探"擦干净了没"——VERIFY 只有在
  // PROM 流用 0x80 0x00 收尾之后才被接受，提前发会回 0x35 这种错误码。
  await sleep(ERASE_WAIT);
  log('  擦除完成', 'ok');
}

async function iapWrite(data, addr, startPct, endPct) {
  log('  写入中…');            // 擦除完成之后紧跟这一条，别让日志空着
  await pipeline((o, n) => promPkt(data, o, n), data.length, CHUNK, 1500,
                 startPct, endPct, '写入', addr);
  // 收尾零包：告诉设备"写完了"，官方工具也这么做
  await cmdOk(promPkt(data, 0, 0), 5000, 0);
  log('  写入完成', 'ok');
}

async function iapVerify(data, addr, startPct, endPct) {
  // 校驗全部內容；不足一包的末尾以重疊完整區塊覆蓋。
  const total = data.length - (data.length % CHUNK_VERIFY);
  await pipeline((o, n) => verifyPkt(data, o, n, addr + o), total, CHUNK_VERIFY, 1500,
                 startPct, endPct, '校验', addr);
  if (total < data.length) {
    const tail = data.length - CHUNK_VERIFY;
    await cmdOk(verifyPkt(data, tail, CHUNK_VERIFY, addr + tail), 1500, 3);
  }
  log('  全部数据校验通过（含末尾）', 'ok');
}

async function iapEnd() {
  // 结束命令设备不回状态，发完自己重启
  try { await sendPkt(Uint8Array.from([CMD_END, 0])); } catch (e) {}
  await sleep(400);
  log('  结束命令已发送', 'ok');
}

// 把内嵌的固件还原出来：base64 -> 异或还原（只是一层混淆，不是加密）
async function connectApp() {
  const fw = FIRMWARE[target];
  // 之前授权过就直接用，省掉每次弹窗
  let d = await openAuthorized(fw.appPid);
  if (d) {
    dev = d;
    resetRx();
    log('连接成功', 'ok');
    return;
  }
  log('请选择设备…（列表里也会显示已在升级模式/boot 的设备）');
  dev = await requestDevice([fw.appPid, fw.iapPid], false);
  if (dev.productId === fw.iapPid) {
    log('选中的是升级模式设备，直接开始烧录', 'ok');
  } else if (dev.productId !== fw.appPid) {
    throw new Error('选的设备不是「' + fw.name + '」');
  } else {
    log('连接成功', 'ok');
  }
  resetRx();
}

/* 2026-11-04: 找已经"在升级模式"的设备。getDevices() 不需要用户手势，
 * 所以用户手动进 boot 再打开工具时，可以直接用它开始烧，不再弹选择框。 */
async function findBootDevice() {
  const seen = await navigator.hid.getDevices().catch(() => []);
  for (const key of Object.keys(FIRMWARE)) {
    const fw = FIRMWARE[key];
    const boots = seen.filter(x => x.vendorId === VENDOR_ID && x.productId === fw.iapPid);
    const d = boots.find(isControlInterface) || boots[0];
    if (d) return { dev: d, key: key };
  }
  return null;
}

// 重新选一次设备（上一次烧录后设备会重启，浏览器手里那个对象可能已经失效了）
async function reconnectApp(fw) {
  try { if (dev) await dev.close(); } catch (e) {}
  dev = null;
  await sleep(400);
  log('  请选择设备…');
  dev = await requestDevice(fw.appPid, true);
  resetRx();
}

async function enterIap() {
  const fw = FIRMWARE[target];
  log('让设备进入升级模式…');
  // 屏幕走 0xbe fe 5 0 ed，键盘/接收器是 0xbe fc 4 ed
  const boot = Uint8Array.from(fw.bootCmd || [0xbe, 0xfc, 4, 0xed]);
  try {
    await sendPkt(boot);
  } catch (err) {
    // 这条命令发不出去，基本就是手里这个设备对象不对（失效的旧对象，
    // 或者 0x3075 上有键盘和屏幕两个设备取错了）——重新选一次再发
    log('  这个设备没响应，请重新选择…', 'warn');
    await reconnectApp(fw);
    await sendPkt(boot);
  }
  /* 等待设备重启成 IAP。这里要短：越久浏览器的"用户手势"窗口越可能过期，
   * 过期后 requestDevice 会直接被拒（第一次用就会表现为"点烧录直接失败"）。 */
  try { await dev.close(); } catch (e) {}
  dev = null;
  await sleep(300);          /* 给设备重启成 IAP 一点时间（总耗时仍远小于手势窗口） */

  // 已授权的 IAP 设备（第二次以后）
  for (let i = 0; i < 5; i++) {
    const d = await openAuthorized(fw.iapPid);
    if (d) {
      dev = d;
      resetRx();
      log('已进入升级模式', 'ok');
      return;
    }
    await sleep(120);
  }

  /* 没授权过：趁手势还有效，直接弹选择框让用户选 boot 设备 */
  log('请在弹出的窗口里选择“升级模式”设备…', 'warn');
  try {
    const d2 = await requestDevice(fw.iapPid, false);
    if (d2 && d2.productId === fw.iapPid) {
      dev = d2;
      resetRx();
      log('已进入升级模式', 'ok');
      return;
    }
    try { if (d2) await d2.close(); } catch (e) {}
    throw new Error('选的不是升级模式设备');
  } catch (err) {
    if (err && err.name === 'NotFoundError') throw err;      /* 用户点了取消 */
    /* 手势过期（SecurityError / NotAllowedError）：交给界面提示点按钮 */
    log('浏览器要求手动点一次才能选设备：' + (err.message || err), 'warn');
  }

  /* 2026-11-04: 不再要求用户点按钮。设备重启成 IAP 后会自动出现在 getDevices()
   * 里（第二次以后已授权），这里轮询等它，出现就继续烧。
   * 只有一直等不到（第一次用、还没授权过）才把"连接升级模式设备"按钮亮出来。 */
  log('等待设备进入升级模式…（进入后会自动开始烧录）', 'warn');
  for (let i = 0; i < 120; i++) {          /* 最多约 30 秒 */
    if (cancelled) throw new Error('已取消');
    const d = await findByPid(fw.iapPid);
    if (d) {
      if (!d.opened) await d.open();
      d.addEventListener('inputreport', onReport);
      dev = d;
      resetRx();
      log('已进入升级模式（自动检测）', 'ok');
      return;
    }
    await sleep(250);
  }
  /* 等不到：多半是这台设备还没被授权过，浏览器必须让用户点一次 */
  pendingFlash = fw;
  log('没等到升级模式设备。第一次使用时，请再点一次【开始烧录】并在弹窗里选它', 'warn');
  throw new NeedGesture('请再点一次【开始烧录】（第一次使用需要在弹窗里选一次设备）');
}

async function start() {
  if (target !== 'ips') throw new Error('此工具仅允许屏幕固件');
  if (running) return;
  if (!selectedImage || !document.getElementById('confirmIps').checked) { setStatus('請先選擇並確認 IPS 固件', 'err'); return; }
  /* 2026-11-05: 没点卡片时，先让用户选设备（列表含 boot 设备），按 PID 自动判断。
   * 这样"强制 boot 上电后直接点开始烧录"也能走通。 */
  if (!target) {
    try {
      const allPids = [];
      for (const k of Object.keys(FIRMWARE)) {
        allPids.push(FIRMWARE[k].appPid, FIRMWARE[k].iapPid);
      }
      const d = await requestDevice(allPids, false);
      const key = keyByIapPid(d.productId)
               || (d.productId === FIRMWARE.ips.appPid ? 'ips' : null);
      if (!key) {
        try { await d.close(); } catch (e) {}
        alert('这个设备无法识别，请先点上面的卡片选择要烧哪台');
        return;
      }
      pick(key);
      dev = d;
      resetRx();
      log('已选设备：' + FIRMWARE[key].name + (d.productId === FIRMWARE[key].iapPid ? '（升级模式）' : ''));
    } catch (e) {
      if (e && e.name !== 'NotFoundError') log('选择设备失败：' + e.message, 'err');
      return;
    }
  }
  const fw = FIRMWARE[target];
  const image = selectedImage;
  running = true;
  document.getElementById('firmwareFile').disabled = true;
  document.getElementById('confirmIps').disabled = true;
  cancelled = false;
  rxq = []; rxWait = null; outId = 0; outLen = 0;
  document.getElementById('btnStart').disabled = true;
  document.getElementById('btnCancel').disabled = false;
  setProgress(0);
  hideBanner();
  log('==== 开始烧录：' + fw.name + ' 固件 ' + fw.version + ' ====');

  try {
    validateFirmware(image.data);
    const data = padFirmware(image.data);
    log(image.name + ' · SHA-256: ' + image.hash);
    log('原始 ' + image.data.length + ' bytes；補齊後寫入及校驗 ' + data.length + ' bytes');
    log('固件已就绪');

    if (!dev) {
      /* 2026-11-04: 先在"已授权设备"里找（不需要用户手势）：
       *  - 设备已经在升级模式：直接用，跳过所有选择框
       *  - 应用模式已授权：直接打开，也只弹一次 boot 选择框 */
      const boot = await findBootDevice();
      if (boot && boot.key === target) {
        dev = boot.dev;
        if (!dev.opened) await dev.open();
        dev.addEventListener('inputreport', onReport);
        resetRx();
        log('检测到已在升级模式的设备，直接开始烧录', 'ok');
      } else {
        await connectApp();
      }
    }

    // 已经是升级模式就直接烧，否则先切过去
    const isIap = dev.productId === fw.iapPid;
    if (!isIap) await enterIap();
    else log('已进入升级模式', 'ok');
    if (!dev) throw new Error('升级模式设备未连接');

    setProgress(1);
    resetRx();                           // 进升级模式时残留的应答不能算作擦除应答
    await iapErase(fw.startAddr);
    setProgress(6);
    await iapWrite(data, fw.startAddr, 6, 80);
    await iapVerify(data, fw.startAddr, 82, 98);
    await iapEnd();
    setProgress(100);
    setStatus(fw.name + ' 烧录成功 ✓', 'ok');
    showBanner('✅ ' + fw.name + ' 烧录成功 —— 固件 ' + fw.version, 'ok');
    document.title = '✓ 烧录成功 · ' + fw.name;
    log('**** 烧录成功', 'ok');
  } catch (e) {
    if (e && e.needGesture) {
      /* 不是失败：浏览器要求一次手势，再点一次【开始烧录】即可（会直接列出 boot 设备） */
      setStatus('请再点一次【开始烧录】继续（浏览器要求手动点一次）', 'warn');
      pendingFlash = pendingFlash || fw;
    } else {
      setStatus('烧录失败：' + e.message, 'err');
      showBanner('❌ 烧录失败：' + e.message + '（可再点一次“开始烧录”重试）', 'err');
      log('**** 失败：' + e.message, 'err');
      pendingFlash = null;
    }
  } finally {
    running = false;
    document.getElementById('firmwareFile').disabled = false;
    document.getElementById('confirmIps').disabled = false;
    updateStartButton();
      document.getElementById('btnCancel').disabled = true;
    if (!pendingFlash) {
      try { if (dev) await dev.close(); } catch (e) {}
      dev = null;
    }
  }
}

function cancel() {
  cancelled = true;
  log('已请求取消…', 'warn');
}

window.addEventListener('load', async () => {
  pick('ips');
  log('就绪。請先選擇 IPS .bin 固件。點擊開始才會連接及寫入。');
  try {
    const boot = await findBootDevice();
    if (boot) {
      pick(boot.key);
      setStatus('已检测到「' + FIRMWARE[boot.key].name + '」正在升级模式，点“开始烧录”即可（不会再弹选择框）', 'ok');
      log('检测到升级模式设备：' + FIRMWARE[boot.key].name, 'ok');
      return;
    }
    /* 应用模式设备已授权时也提示一下，省得用户以为没连上 */
    const seen = await navigator.hid.getDevices();
    for (const key of Object.keys(FIRMWARE)) {
      const d = seen.find(x => x.vendorId === VENDOR_ID && x.productId === FIRMWARE[key].appPid);
      if (d) { log('检测到已授权的设备：' + FIRMWARE[key].name, 'ok'); break; }
    }
  } catch (e) { /* 没权限/不支持就算了，不影响正常流程 */ }
});
</script>
